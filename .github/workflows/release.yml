name: Android Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-release:
    name: Build signed APK
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_FILE: adhan-release.jks
      KEYSTORE_PROPERTIES_FILE: keystore.properties

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;35.0.0

      - name: Accept Android SDK licenses
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true

      - name: Restore signing files from GitHub Secrets
        shell: bash
        env:
          RELEASE_CONFIG_BASE64: ${{ secrets.RELEASE_CONFIG_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_CONFIG_BASE64"
          export JSON_CONFIG
          JSON_CONFIG=$(printf '%s' "$RELEASE_CONFIG_BASE64" | base64 --decode)
          python3 - <<'PY'
          import base64
          import json
          import os

          data = json.loads(os.environ["JSON_CONFIG"])
          keystore_b64 = data["keystore_base64"]
          keystore_b64 += "=" * (-len(keystore_b64) % 4)
          with open("adhan-release.jks", "wb") as f:
              f.write(base64.b64decode(keystore_b64))
          with open("keystore.properties", "w") as f:
              f.write("storeFile=adhan-release.jks\n")
              f.write("storePassword={}\n".format(data["store_password"]))
              f.write("keyAlias={}\n".format(data["key_alias"]))
              f.write("keyPassword={}\n".format(data["key_password"]))
          PY
          chmod 600 "$ANDROID_KEYSTORE_FILE" "$KEYSTORE_PROPERTIES_FILE"

      - name: Run tests and build release
        run: ./gradlew --no-daemon test lint assembleRelease

      - name: Verify signed APK
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          sha256sum "$APK"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: adhan-reminder-release-${{ github.ref_name }}
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Remove signing files
        if: always()
        shell: bash
        run: rm -f "$ANDROID_KEYSTORE_FILE" "$KEYSTORE_PROPERTIES_FILE"
