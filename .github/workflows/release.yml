name: Android Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build-release:
    name: Build signed APK
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_FILE: adhan-release.jks
      KEYSTORE_PROPERTIES_FILE: keystore.properties

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;35.0.0

      - name: Restore signing files from GitHub Secrets
        shell: bash
        env:
          RELEASE_CONFIG_BASE64: ${{ secrets.RELEASE_CONFIG_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$RELEASE_CONFIG_BASE64"
          JSON_CONFIG=$(printf '%s' "$RELEASE_CONFIG_BASE64" | base64 --decode)
          python3 -c '
          import json, os, base64
          data = json.loads(os.environ["JSON_CONFIG"])
          with open("adhan-release.jks", "wb") as f:
              f.write(base64.b64decode(data["keystore_base64"]))
          with open("keystore.properties", "w") as f:
              f.write("storeFile=adhan-release.jks\n")
              f.write(f"storePassword={data[\"store_password\"]}\n")
              f.write(f"keyAlias={data[\"key_alias\"]}\n")
              f.write(f"keyPassword={data[\"key_password\"]}\n")
          '
          chmod 600 "$ANDROID_KEYSTORE_FILE" "$KEYSTORE_PROPERTIES_FILE"

      - name: Run tests and build release
        run: ./gradlew --no-daemon test lint assembleRelease

      - name: Verify signed APK
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/release/app-release.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs "$APK"
          sha256sum "$APK"

      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: adhan-reminder-release-${{ github.ref_name }}
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Remove signing files
        if: always()
        shell: bash
        run: rm -f "$ANDROID_KEYSTORE_FILE" "$KEYSTORE_PROPERTIES_FILE"
